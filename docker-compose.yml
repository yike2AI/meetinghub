services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meetinghub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetinghub
    ports:
      - "5432:5432"
    volumes:
      - meetinghub_pg:/var/lib/postgresql/data
      - ./infra/init-pg.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetinghub"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: meetinghub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  meetinghub_pg:
